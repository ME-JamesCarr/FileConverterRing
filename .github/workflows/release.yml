# Builds FileRing-Setup.exe on Windows and attaches it to a GitHub Release.
#
# Release a new version:   git tag v1.0.1 && git push origin v1.0.1
# Or run it by hand from the Actions tab (builds and self-tests, publishes only for tags).
name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build FileRing.exe
        run: python build.py

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\FileRing\FileRing.exe -ArgumentList "--selftest", "selftest-out" -Wait -PassThru
          Get-Content selftest-out\report.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed ($($p.ExitCode) failures)" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileRing-Setup
          path: release/FileRing-Setup.exe
          retention-days: 14

      - name: Publish to the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/FileRing-Setup.exe --clobber
          } else {
            gh release create $tag release/FileRing-Setup.exe --title "FileRing $tag" --generate-notes
          }
